name: Docker & CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Code & Config Sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Python syntax
        run: |
          python -m compileall -q backend app main_app.py

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config

  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Subtitle Engine Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: live-subtitle-studio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Layers (Ensure no large model weights baked in)
        run: |
          echo "Verifying image size is lightweight (no heavy model weights committed in image)..."
          docker images live-subtitle-studio:latest
