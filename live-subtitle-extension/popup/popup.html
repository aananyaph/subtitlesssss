<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Subtitle - Application Controls</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
        <span class="title">Live Subtitle</span>
      </div>
      <div id="statusBadge" class="status-badge status-inactive">
        <span class="status-dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <!-- Error Alert Box -->
    <div id="errorBanner" class="error-banner hidden">
      <span class="error-icon">⚠️</span>
      <span id="errorMessage" class="error-text">An error occurred</span>
    </div>

    <!-- Active Tab Info -->
    <div id="tabInfoContainer" class="tab-info-container">
      <span class="tab-label">Target:</span>
      <span id="tabTitleText" class="tab-title">Active Browser Tab</span>
    </div>

    <!-- Primary Captions Start / Stop Control -->
    <div class="button-group">
      <button id="btnStart" class="btn btn-start">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Start Captions
      </button>
      <button id="btnStop" class="btn btn-stop" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
        Stop Captions
      </button>
    </div>

    <!-- User Settings Controls -->
    <div class="settings-card">
      <div class="settings-header">
        <span class="settings-title">Subtitle Options</span>
      </div>
      
      <div class="setting-row">
        <label for="selectSize" class="setting-label">Font Size</label>
        <select id="selectSize" class="setting-select">
          <option value="small">Small (20px)</option>
          <option value="medium" selected>Medium (28px)</option>
          <option value="large">Large (36px)</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="selectPosition" class="setting-label">Position</label>
        <select id="selectPosition" class="setting-select">
          <option value="bottom" selected>Bottom</option>
          <option value="middle">Middle</option>
          <option value="top">Top</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="selectLanguage" class="setting-label">Language</label>
        <select id="selectLanguage" class="setting-select">
          <option value="auto" selected>Auto Detect</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="selectModel" class="setting-label">ASR Model</label>
        <select id="selectModel" class="setting-select">
          <option value="tiny" selected>tiny (int8 CPU)</option>
        </select>
      </div>
    </div>

    <!-- Audio Activity Level -->
    <div class="section meter-section">
      <div class="section-header">
        <span class="section-title">Audio Activity</span>
        <span id="meterPercent" class="meter-value">0%</span>
      </div>
      <div class="meter-track">
        <div id="meterFill" class="meter-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Audio Verification Action -->
    <div class="verification-section">
      <button id="btnExportWav" class="btn btn-export" disabled>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download 5s WAV Sample
      </button>
    </div>

    <!-- Local Backend Connection Toggle -->
    <footer class="footer">
      <div class="ws-toggle-container">
        <label class="switch">
          <input type="checkbox" id="toggleWs" checked>
          <span class="slider round"></span>
        </label>
        <span class="ws-label">Stream to Local Python (ws://localhost:8765)</span>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
